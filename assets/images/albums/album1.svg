<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0017"/>
      <stop offset="50%" stop-color="#1e0836"/>
      <stop offset="100%" stop-color="#05010a"/>
    </linearGradient>
    <radialGradient id="neonGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0017" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="url(#bg1)"/>
  <circle cx="250" cy="220" r="160" fill="url(#neonGlow1)"/>
  <!-- Perspective Sun/Moon -->
  <circle cx="250" cy="200" r="90" fill="none" stroke="#d946ef" stroke-width="4" opacity="0.9"/>
  <circle cx="250" cy="200" r="70" fill="#a855f7" opacity="0.25"/>
  <!-- Cyber Grid Lines -->
  <path d="M 0 350 L 500 350 M 0 380 L 500 380 M 0 420 L 500 420 M 0 470 L 500 470" stroke="url(#gridGrad)" stroke-width="1.5" opacity="0.6"/>
  <path d="M 50 500 L 220 320 M 150 500 L 240 320 M 250 500 L 250 320 M 350 500 L 260 320 M 450 500 L 280 320" stroke="#a855f7" stroke-width="1.5" opacity="0.5"/>
  <!-- Soundwave equalizer spikes -->
  <g fill="#06b6d4" opacity="0.8">
    <rect x="180" y="270" width="6" height="30" rx="3"/>
    <rect x="195" y="250" width="6" height="50" rx="3"/>
    <rect x="210" y="235" width="6" height="65" rx="3"/>
    <rect x="225" y="220" width="6" height="80" rx="3"/>
    <rect x="240" y="200" width="6" height="100" rx="3" fill="#ec4899"/>
    <rect x="255" y="200" width="6" height="100" rx="3" fill="#ec4899"/>
    <rect x="270" y="220" width="6" height="80" rx="3"/>
    <rect x="285" y="235" width="6" height="65" rx="3"/>
    <rect x="300" y="250" width="6" height="50" rx="3"/>
    <rect x="315" y="270" width="6" height="30" rx="3"/>
  </g>
  <!-- Typography Badge -->
  <rect x="40" y="40" width="130" height="26" rx="13" fill="#2e1065" stroke="#a855f7" stroke-width="1.5"/>
  <text x="105" y="57" fill="#e9d5ff" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle" letter-spacing="2">SYNTHWAVE</text>
  <text x="40" y="450" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="28" letter-spacing="1">CYBER NOCTURNE</text>
  <text x="40" y="475" fill="#a855f7" font-family="sans-serif" font-weight="600" font-size="16" letter-spacing="1.5">NEON MIRAGE</text>
</svg>